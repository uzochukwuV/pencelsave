[package]
name = "solana_project"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solana_project"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.29.0", features = ["init-if-needed"] }
anchor-spl = { version = "0.29.0", features = ["metadata"] }
solana-program = "=1.17.0"
spl-token = "=3.5.0"
spl-memo = "=3.0.1"
ahash = "=0.8.11"
proc-macro2 = "1.0.86"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
opt-level = "z"
